[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pediatric-bone-age-engine"
version = "2.0.0"
description = "Manual bone-age comparison and demonstration Python rule engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[project.scripts]
pediatric-bone-age-engine = "pediatric_bone_age_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/pediatric-bone-age-agent"
Repository = "https://github.com/abusuraihsakhri/pediatric-bone-age-agent.git"
