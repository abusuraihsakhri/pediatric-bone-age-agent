name: Python and browser regression tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      AUDIT_SECRET_KEY: ci-only-unit-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server]" pytest httpx build
          python -m pip check
      - name: Python syntax and package build
        run: |
          python -m compileall -q agents pediatric_bone_age_agent bone_age_sentinel.py cli.py enrichment.py simulator.py
          python -m build
      - name: Python regression suite
        run: python -m pytest -q
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --test web/app.test.cjs
